<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#0E0E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Matter">
<meta name="mobile-web-app-capable" content="yes">
<title>Money Matter CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--ink:#F2EEE3;--muted:#A39C8A;--line:#3A3426;--ground:#0E0E0E;--surface:#17150F;--col:#1D1A12;--accent:#C9A227;--on-accent:#0E0E0E;--accent-soft:#2B2410;--warn:#F2867E;--warn-soft:#3A1714}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:26px}
.who{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.tab{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:var(--on-accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{font:700 26px 'Space Grotesk',sans-serif}
.board{overflow-x:auto;padding-bottom:8px}
.cols{display:flex;gap:12px;width:max-content}
.col{width:230px;background:var(--col);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.colh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.count{background:var(--ground);border-radius:999px;padding:1px 9px;font-size:12px}
.card{text-align:left;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card b{font-size:14px}
.card small{font-size:12px;color:var(--muted)}
.due{color:var(--warn);font-weight:600}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--col);font-size:14px}
tr.click{cursor:pointer}tr.click:hover{background:var(--ground)}
.scroll{overflow-x:auto}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink);font-size:15px}
textarea{min-height:70px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{min-height:auto;width:20px;height:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;justify-content:flex-end;z-index:10}
.drawer{border-left:1px solid var(--line);width:min(560px,100%);height:100%;overflow-y:auto;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.note{font-size:12px;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1px solid #6A2E28;border-radius:10px;padding:12px;font-size:13px;color:#F6DAD6}
.acts{display:flex;flex-direction:column;gap:8px}
.act{border-left:3px solid var(--line);padding:4px 10px;font-size:13px}
.act time{display:block;font-size:11px;color:var(--muted)}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);background:var(--ground)}
.login .panel{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding:28px;margin:auto;border-color:rgba(201,162,39,.35);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.login>.panel,.login>form.panel{align-self:center;justify-self:center}
.login .side{display:flex;padding:32px 20px}
.hero{position:sticky;top:0;align-self:start;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:48px;min-height:100vh;color:#F2EEE3;
  background-color:#0E0E0E;
  background-image:linear-gradient(180deg,rgba(14,14,14,.6) 0%,rgba(14,14,14,.12) 28%,rgba(14,14,14,.35) 52%,rgba(14,14,14,.96) 88%),var(--photo,none),
    radial-gradient(900px 600px at 85% 0%,rgba(201,162,39,.22),transparent 65%),
    repeating-linear-gradient(135deg,rgba(201,162,39,.07) 0 1px,transparent 1px 22px);
  background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:18px;border:1px solid rgba(201,162,39,.55);pointer-events:none}
.hero .mark{display:flex;align-items:center;gap:14px;font:700 13px Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.hero .mark i{display:block;width:44px;height:3px;background:var(--accent)}
.hero h2{font-size:clamp(28px,3.6vw,48px);line-height:1.05;letter-spacing:-.02em;max-width:14ch;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{margin:12px 0 0;font-size:16px;color:#D9D1BE;max-width:44ch}
.perks{margin:0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.6}
.hero .langs{margin-top:22px;font-size:13px;letter-spacing:.06em;color:#D9D1BE}
@media (max-width:820px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .hero{position:relative;height:auto;min-height:56vh;padding:34px 30px 60px;background-position:center top}
  .hero h2{font-size:24px;max-width:none}
  .hero p{display:none}
  .hero .langs{margin-top:10px;font-size:12px}
  .hero::after{inset:12px}
  .hero p{font-size:15px}
  .login .side{padding:20px 16px 36px;align-items:flex-start}
  .login .panel{margin:-34px auto 0;position:relative;z-index:1}
}
.err{color:var(--warn);font-size:13px;min-height:1em;margin:0}
.linkbtn{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-align:left}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:600;padding:12px 18px;border-radius:10px;font-size:14px;z-index:20}
.tab-board>.kpis,.tab-board>.row,.tab-recruits>.kpis,.tab-recruits>.row{display:none}
.goal{display:flex;flex-direction:column;gap:6px;font-size:14px}
.track{height:12px;border-radius:999px;background:var(--ground);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
tr.me td{background:var(--accent-soft)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.duerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-top:1px solid var(--line)}
.duerow small{color:var(--muted);flex:1;min-width:160px;font-size:13px}
.linkname{background:none;border:0;padding:0;min-height:44px;color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
a.tel{color:var(--accent);font-weight:600}
h1 em{font-style:normal;color:var(--accent)}
#instbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:90;display:flex;gap:10px;align-items:center;
 background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;
 box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px}
#instbar span{flex:1}
#instbar b{color:var(--accent)}
#instbar button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;
 background:var(--accent);color:var(--on-accent)}
#instbar #instx{background:transparent;color:var(--muted);border:1px solid var(--line)}
</style>
</head>

(function findPhoto(names) {
  if (TEAM_PHOTO) return document.documentElement.style.setProperty('--photo', 'url("' + TEAM_PHOTO + '")');
  if (!names.length) return;
  const im = new Image();
  im.onload = () => document.documentElement.style.setProperty('--photo', 'url("' + names[0] + '")');
  im.onerror = () => findPhoto(names.slice(1));
  im.src = names[0];

function copyText(text, okMsg) {
  const done = () => toast(okMsg || 'Copied');
  const manual = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(text); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual); else manual();
}

// ---------- Notifications ----------
const onPhone = () => /iphone|ipad|ipod|android/i.test(navigator.userAgent);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const installed = () => window.navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;
const keyBytes = k => {
  const pad = '='.repeat((4 - k.length % 4) % 4);
  const raw = atob((k + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(Array.from(raw, c => c.charCodeAt(0)));
};
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (isIOS() && !installed()) return 'needs_install';
  if (Notification.permission === 'denied') return 'blocked';
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return 'off';
  return (await reg.pushManager.getSubscription()) ? 'on' : 'off';
}
async function pushOn() {
  if (Notification.permission !== 'granted') {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return 'Your phone blocked notifications. Turn them on in Settings for this site, then try again.';
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC) });
    } catch (e) { return 'Your phone would not register: ' + e.message; }
  }
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_sub', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
    p_label: (navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/i) || ['Phone'])[0]
  });
  if (error) return /function|schema cache/i.test(error.message)
    ? 'Not set up yet. Ask Theo to run the notifications database step.' : error.message;
  return '';
}
async function pushOff() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (!sub) return;
  const ep = sub.endpoint;
  await sub.unsubscribe();
  await sb.from('push_subs').delete().eq('endpoint', ep);
}

async function drawPush(ov) {
  const note = ov.querySelector('#pushnote'), row = ov.querySelector('#pushrow');
  if (!note) return;
  const st = await pushState();
  row.innerHTML = '';
  if (st === 'unsupported') {
    note.textContent = 'This browser cannot send notifications. Open the CRM in Safari or Chrome on your phone.';
    return;
  }
  if (st === 'needs_install') {
    note.innerHTML = 'On iPhone you have to add Money Matter to your home screen first: tap <b>Share</b>, then <b>Add to Home Screen</b>. Open it from there and this button will work.';
    return;
  }
  if (st === 'blocked') {
    note.textContent = 'Your phone is blocking notifications for this site. Turn them back on in your phone settings, then reopen this.';
    return;
  }
  if (st === 'on') {
    note.textContent = 'On. You get a buzz when a new lead signs up through your link.';
    row.innerHTML = '<button type="button" class="btn ghost small" id="ptest">Send me a test</button>' +
                    '<button type="button" class="btn ghost small" id="poff">Turn off</button>';

// ---------- Import / export (admin) ----------
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; if (row.some(x => x.trim())) rows.push(row); row = [];
    } else cur += ch;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
const digits = v => String(v || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
const LANGS = { english: 'English', en: 'English', kreyol: 'Kreyòl', 'kreyòl': 'Kreyòl', creole: 'Kreyòl', 'haitian creole': 'Kreyòl', espanol: 'Español', 'español': 'Español', spanish: 'Español' };
function csvToClients(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { error: 'That file looks empty.' };
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = (...names) => head.findIndex(h => names.includes(h));
  const iName = col('full name', 'name', 'client', 'client name', 'full_name');
  const iFirst = col('first name', 'first', 'firstname', 'first_name'), iLast = col('last name', 'last', 'lastname', 'last_name');
  const iPhone = col('phone', 'cell', 'mobile', 'phone number', 'cell phone'), iEmail = col('email', 'email address', 'e-mail');
  const iState = col('state', 'st'), iLang = col('language', 'lang');
  if (iName < 0 && iFirst < 0) return { error: 'No name column found. The first row needs a "Full name" column (or "First name" and "Last name").' };
  const have = new Set(S.clients.map(c => digits(c.phone)).filter(Boolean));
  let skipped = 0, dupes = 0; const list = [];
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 ? (r[i] || '').trim() : '';
    const name = g(iName) || [g(iFirst), g(iLast)].filter(Boolean).join(' ');
    if (!name) return skipped++;
    const ph = digits(g(iPhone));
    if (ph && have.has(ph)) return dupes++;
    if (ph) have.add(ph);
    const st = g(iState).toUpperCase();
    list.push({ full_name: name, phone: g(iPhone) || null, email: g(iEmail).toLowerCase() || null,
      state: st.length === 2 ? st : null, language: LANGS[g(iLang).toLowerCase()] || null });
  });
  return { list, skipped, dupes };
}
function downloadFile(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + text], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvCell = v => { v = v == null ? '' : String(v); if (/^[=@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportClients() {
  const cols = ['full_name', 'phone', 'email', 'state', 'language', 'stage', 'agent', 'return_type', 'fee', 'lead_source', 'campaign', 'next_follow_up', 'bank_product', 'returning_client'];
  const lines = [cols.join(',')].concat(visible().map(c => cols.map(k =>
    csvCell(k === 'agent' ? agentName(c.agent_id) : k === 'stage' ? stageName(c.stage) : c[k])).join(',')));
  downloadFile('money-matter-clients-' + today() + '.csv', lines.join('\r\n'));
  toast('Exported ' + visible().length + ' clients');
}
function openImport() {
  let parsed = null;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<aside class="drawer" role="dialog" aria-label="Import clients">
    <div class="row" style="justify-content:space-between"><h2>Import clients</h2><button class="btn ghost small" id="x">Close</button></div>
    <p style="margin:0">Upload a spreadsheet saved as <b>CSV</b>. The first row must be column names: <b>Full name, Phone, Email, State, Language</b>. Only Full name is required.</p>
    <div class="warnbox">Leave out SSNs, dates of birth, bank numbers and anything from the tax return. Only the columns above are imported; everything else in the file is ignored.</div>
    <button class="btn ghost small" id="tpl" style="align-self:flex-start">Download a blank template</button>
    <label>Assign these clients to<select id="iag">${S.agents.map(a => `<option value="${a.id}" ${a.id === S.me.id ? 'selected' : ''}>${esc(a.full_name)}</option>`).join('')}</select></label>

    go.disabled = !r.list.length; go.textContent = 'Import ' + r.list.length + ' clients';
  };
  go.onclick = async () => {
    if (!parsed || !parsed.length) return;
    go.disabled = true;
    const agent_id = ov.querySelector('#iag').value;
    const recs = parsed.map(c => ({ ...c, agent_id, stage: 'new_lead', returning_client: true, bank_product: false, lead_source: 'Returning' }));
    let done = 0;
    for (let i = 0; i < recs.length; i += 200) {

      if (error) { toast(`Stopped after ${done} clients: ${error.message}`); close(); return loadAll(); }
      done += Math.min(200, recs.length - i);
    }
    toast('Imported ' + done + ' clients'); close(); loadAll();
  };
}

      <td>${r.phone ? `<a class="tel" href="tel:${esc(telOf(r))}">${esc(r.phone)}</a>` : ''}</td>
      <td>${r.experience === 'yes' ? 'Experienced' : r.experience === 'some' ? 'A little' : 'Brand new'}</td>
      <td>${esc(r.language)}</td>
      ${isAdmin() ? `<td>${r.referred_by ? esc(agentName(r.referred_by)) : '— (company link)'}</td>` : ''}
      <td>${esc(String(r.created_at || '').slice(0, 10))}</td>
      <td><select data-rs="${r.id}" aria-label="Status for ${esc(r.full_name)}">${RSTATUS.map(x => `<option ${r.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
      <td><input type="date" data-rf="${r.id}" aria-label="Next follow-up for ${esc(r.full_name)}" value="${esc(r.next_follow_up)}" style="min-width:150px"></td>
      <td>${telOf(r) ? `<span class="row"><a class="btn small" href="tel:${esc(telOf(r))}">Call</a><a class="btn ghost small" data-rt="${r.id}" href="sms:${esc(telOf(r))}">${r.status === 'New' ? 'Welcome text' : 'Text'}</a></span>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="9">No recruits yet. Share your front door link and they will land here.</td></tr>'}
    </tbody></table></div>
    <p class="note">Recruits come from the “Become a tax agent” form on your front door page. Never promise a specific income.</p>
    ${isAdmin() && S.traffic ? `<div class="panel" style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:20px">Front door traffic</h2>
      <section class="kpis" style="margin:0">
        <div class="panel kpi"><span>Visits (7 days)</span><b>${S.traffic.views7 || 0}</b></div>
        <div class="panel kpi"><span>Tapped “taxes”</span><b>${S.traffic.taxes7 || 0}</b></div>
        <div class="panel kpi"><span>Tapped “book”</span><b>${S.traffic.book7 || 0}</b></div>
        <div class="panel kpi"><span>Tapped “agent”</span><b>${S.traffic.agent7 || 0}</b></div>
        <div class="panel kpi"><span>Signed up</span><b>${(S.traffic.vip7 || 0) + (S.traffic.recruit7 || 0)}</b></div>
        <div class="panel kpi"><span>Visit to sign-up</span><b>${S.traffic.views7 ? Math.round(((S.traffic.vip7 || 0) + (S.traffic.recruit7 || 0)) / S.traffic.views7 * 100) + '%' : '—'}</b></div>
      </section>
      <p class="note">Last 7 days, from your front door page. ${S.traffic.views30 || 0} visits in the last 30 days.</p>
    </div>` : ''}`;
  $('#rblast').onclick = openRecruitBlast;
  $('#body').querySelectorAll('[data-rf]').forEach(inp => inp.onchange = async () => {
    const { error } = await sb.from('recruits').update({ next_follow_up: inp.value || null }).eq('id', inp.dataset.rf);
    if (error) return toast(/next_follow_up/.test(error.message) ? 'Run the database step first, then set follow-up dates.' : error.message);
    S.recruits.find(x => x.id === inp.dataset.rf).next_follow_up = inp.value || null;
    toast('Saved');
  });
  $('#body').querySelectorAll('[data-rs]').forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from('recruits').update({ status: sel.value }).eq('id', sel.dataset.rs);
    if (error) return toast(error.message);
    const r = S.recruits.find(x => x.id === sel.dataset.rs); r.status = sel.value;
    toast('Saved'); renderBody();
  });
  $('#body').querySelectorAll('[data-rt]').forEach(a => a.onclick = () => {
    const r = S.recruits.find(x => x.id === a.dataset.rt);
    a.href = smsHref(r, `Hi ${firstName(r)}, this is ${S.me.full_name} with Money Matter Tax Services. Thanks for your interest in becoming a tax agent. Our Opportunity Call is Thursday at 8PM Eastern on Zoom — want me to send you the link?`);
  });
  $('#body').querySelectorAll('a.tel').forEach(a => a.onclick = e => e.stopPropagation());
}

// ---------- Scoreboard ----------
function renderBoard() {
  const mine = S.clients.filter(c => c.agent_id === S.me.id);
  const myFees = mine.filter(isDone).reduce((t, c) => t + Number(c.fee || 0), 0);
  const split = S.me.split_pct == null ? null : Number(S.me.split_pct);
  const rows = S.board || [];
  const teamFiled = rows.reduce((t, r) => t + Number(r.filed || 0), 0), teamBank = rows.reduce((t, r) => t + Number(r.bank_products || 0), 0);
  const gross = S.clients.filter(isDone).reduce((t, c) => t + Number(c.fee || 0), 0);
  $('#body').innerHTML = `<div class="panel" style="margin-bottom:16px;display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:20px">Your numbers</h2>
      <section class="kpis" style="margin:0">
        <div class="panel kpi"><span>Your clients</span><b>${mine.length}</b></div>
        <div class="panel kpi"><span>Filed</span><b>${mine.filter(isDone).length}</b></div>
        <div class="panel kpi"><span>Bank products (filed)</span><b>${mine.filter(c => c.bank_product && isDone(c)).length}</b></div>
        <div class="panel kpi"><span>Fees booked</span><b>${money(myFees)}</b></div>
        <div class="panel kpi"><span>Your estimated earnings${split == null ? '' : ' (' + split + '% split)'}</span><b style="color:var(--accent)">${split == null ? '—' : money(Math.round(myFees * split / 100))}</b></div>
      </section>
      <p class="note" style="margin:0">${split == null ? 'Your split has not been set yet. Ask Theo to add it.' : 'Estimate only: fees on filed and funded clients times your split. Your actual pay comes from Theo.'}</p>
    </div>
    ${S.board ? `<div class="panel" style="margin-bottom:16px;display:flex;flex-direction:column;gap:14px">
      <h2 style="font-size:20px">Team goals</h2>
      ${bar('Clients filed', teamFiled, GOALS.clients)}
      ${bar('Bank products', teamBank, GOALS.bank)}
      ${isAdmin() ? bar('Fees booked (only you see this)', gross, GOALS.gross, money) : ''}
    </div>
    <div class="panel scroll" style="padding:0"><table style="min-width:520px"><thead><tr><th>#</th><th>Agent</th><th>Leads</th><th>Filed</th><th>Bank products</th></tr></thead>
      <tbody>${rows.map((r, k) => `<tr class="${r.agent_id === S.me.id ? 'me' : ''}"><td>${k + 1}</td><td><b>${esc(r.full_name)}</b>${r.agent_id === S.me.id ? ' (you)' : ''}</td>
        <td>${r.leads}</td><td>${r.filed}</td><td>${r.bank_products}</td></tr>`).join('') || '<tr><td colspan="5">No agents yet.</td></tr>'}</tbody></table></div>
    <p class="note">Ranked by clients filed. Everyone sees counts only. Nobody sees another agent's clients or fees.</p>`
    : '<div class="panel"><p style="margin:0">The team scoreboard is not set up yet. Ask Theo to run the database step.</p></div>'}`;
}

// ---------- Agents (admin) ----------
function renderAgents() {
  $('#body').innerHTML = `<div class="panel" style="margin-bottom:16px;display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:20px">Add an agent</h2>
      <p class="note" style="margin:0">The agent creates their own account on the login screen first ("New agent? Create your account"). Then add them here with the same email to turn on their access.</p>
      <form id="af" class="grid2"><label>Full name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <div style="display:flex;align-items:flex-end"><button class="btn">Add agent</button></div></form>
    </div>
    <div class="row" style="margin-bottom:12px"><button class="btn small" id="teamtext">Text the team</button></div>
    <div class="panel scroll" style="padding:0"><table><thead><tr><th>Agent</th><th>Cell phone</th><th>Clients</th><th>Filed</th><th>Funded</th><th>Fees booked</th><th>Split %</th><th>Est. payout</th><th>Documents link</th><th>Booking link</th>
      <th>Cognito access</th><th>File w/o review</th><th>Active</th></tr></thead><tbody>
      ${S.agents.map(a => {
        const mine = S.clients.filter(c => c.agent_id === a.id);
        const self = a.id === S.me.id;
        return `<tr><td><b>${esc(a.full_name)}</b><br><span class="note">${esc(a.email)}${a.role === 'admin' ? ' · Admin' : ''}</span></td>
          <td>${mine.length}</td><td>${mine.filter(isDone).length}</td><td>${mine.filter(c => c.stage === 'funded').length}</td>
          <td>${money(mine.filter(isDone).reduce((t, c) => t + Number(c.fee || 0), 0))}</td>
          <td><input type="tel" inputmode="tel" aria-label="Cell phone for ${esc(a.full_name)}" data-ph="${a.id}" value="${esc(a.phone)}" placeholder="For team texts" style="min-width:140px"></td>
          <td><input type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Split percent for ${esc(a.full_name)}" data-split="${a.id}" value="${a.split_pct == null ? '' : esc(a.split_pct)}" style="width:84px"></td>
          <td>${a.split_pct == null ? '—' : money(Math.round(mine.filter(isDone).reduce((t, c) => t + Number(c.fee || 0), 0) * Number(a.split_pct) / 100))}</td>
          <td><input type="url" aria-label="Documents link for ${esc(a.full_name)}" data-intake="${a.id}" value="${esc(a.intake_url)}" placeholder="${a.role === 'admin' ? 'Company link (used by everyone)' : 'Leave blank to use the company link'}" style="min-width:220px"></td>
          <td><input type="url" aria-label="Booking link for ${esc(a.full_name)}" data-book="${a.id}" value="${esc(a.booking_url)}" placeholder="${a.role === 'admin' ? 'Company link (used by everyone)' : 'Leave blank to use the company link'}" style="min-width:220px"></td>
          ${['cognito_access','can_file_without_review','active'].map(f => `<td><input type="checkbox" aria-label="${f} for ${esc(a.full_name)}" data-a="${a.id}" data-f="${f}" ${a[f] ? 'checked' : ''} ${self ? 'disabled' : ''}></td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>`;
  $('#body').insertAdjacentHTML('beforeend', '<p class="note">Documents link: paste the Cognito form link clients use to send their documents. Booking link: where clients pick an appointment time. Your own row is the company link for both, used by every agent who has no link of their own.</p>');
  $('#teamtext').onclick = openTeamText;
  $('#af').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { data, error } = await sb.rpc('add_agent_by_email', { p_email: f.get('email'), p_name: f.get('name') });
    if (error) return toast(error.message);
    toast(data); loadAll();
  };
  $('#body').querySelectorAll('[data-ph]').forEach(inp => inp.onchange = async () => {
    const val = inp.value.trim() || null;
    const { error } = await sb.from('agents').update({ phone: val }).eq('id', inp.dataset.ph);
    if (error) return toast(/phone/.test(error.message) ? 'Run the database step first, then add phone numbers.' : error.message);
    const a = S.agents.find(x => x.id === inp.dataset.ph); a.phone = val;
    if (a.id === S.me.id) S.me.phone = val;
    toast('Phone saved');
  });
  $('#body').querySelectorAll('[data-book]').forEach(inp => inp.onchange = async () => {
    const val = inp.value.trim() || null;
    if (val && !/^https:\/\//i.test(val)) return toast('The link must start with https://');
    const { error } = await sb.from('agents').update({ booking_url: val }).eq('id', inp.dataset.book);
    if (error) return toast(/booking_url/.test(error.message) ? 'Run the database step first, then set booking links.' : error.message);
    const a = S.agents.find(x => x.id === inp.dataset.book); a.booking_url = val;
    if (a.id === S.me.id) { S.me.booking_url = val; if (a.role === 'admin') S.booking = val || ''; }
    toast('Booking link saved');
  });
  $('#body').querySelectorAll('[data-intake]').forEach(inp => inp.onchange = async () => {
    const val = inp.value.trim() || null;
    if (val && !/^https:\/\//i.test(val)) return toast('The link must start with https://');
    const { error } = await sb.from('agents').update({ intake_url: val }).eq('id', inp.dataset.intake);
    if (error) return toast(/intake_url/.test(error.message) ? 'Run the database step first, then set documents links.' : error.message);
    const a = S.agents.find(x => x.id === inp.dataset.intake); a.intake_url = val;
    if (a.id === S.me.id) { S.me.intake_url = val; if (a.role === 'admin') S.intake = val || ''; }
    toast('Documents link saved');
  });
  $('#body').querySelectorAll('[data-split]').forEach(inp => inp.onchange = async () => {
    const val = inp.value === '' ? null : Math.max(0, Math.min(100, Number(inp.value)));
    const { error } = await sb.from('agents').update({ split_pct: val }).eq('id', inp.dataset.split);
    if (error) return toast(/split_pct/.test(error.message) ? 'Run the database step first, then set splits.' : error.message);
    const a = S.agents.find(x => x.id === inp.dataset.split); a.split_pct = val; if (a.id === S.me.id) S.me.split_pct = val;
    toast('Split saved'); renderAgents();
  });
  $('#body').querySelectorAll('[data-f]').forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from('agents').update({ [cb.dataset.f]: cb.checked }).eq('id', cb.dataset.a);
    if (error) { toast(error.message); cb.checked = !cb.checked; return; }
    const a = S.agents.find(x => x.id === cb.dataset.a); a[cb.dataset.f] = cb.checked; toast('Saved');
  });
}

// ---------- Client drawer ----------
async function openClient(id) {
  const c = id ? S.clients.find(x => x.id === id) : { stage: 'new_lead', agent_id: S.me.id, bank_product: false, returning_client: false };
  let cognito = null, acts = [];
  if (id) {
    const [cg, ac] = await Promise.all([
      sb.from('client_cognito').select('*').eq('client_id', id).maybeSingle(),
      sb.from('activities').select('*').eq('client_id', id).order('created_at', { ascending: false }).limit(50)
    ]);
    cognito = cg.data; acts = ac.data || [];
  }
  const canCognito = S.me.role === 'admin' || S.me.cognito_access;
  const i = stageIdx(c.stage);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<aside class="drawer" role="dialog" aria-label="Client details">
    <div class="row" style="justify-content:space-between">
      <div><h2>${id ? esc(c.full_name) : 'New client'}</h2>${id ? `<span class="pill">${stageName(c.stage)}</span>` : ''}</div>
      <button class="btn ghost small" id="x">Close</button></div>
    ${id ? `<div class="row">
      <button class="btn ghost small" id="back" ${i <= 0 ? 'disabled' : ''}>← Back a stage</button>
      <button class="btn small" id="next" ${i >= STAGES.length - 1 ? 'disabled' : ''}>Move to ${i < STAGES.length - 1 ? stageName(STAGES[i + 1][0]) : '—'} →</button>${phoneBtns(c)}${bookingFor(c) && telOf(c) ? '<a class="btn ghost small" id="book" href="#">Send booking link</a>' : ''}</div>` : ''}
    <form id="cf" class="grid2">
      <label>Full name<input name="full_name" required value="${esc(c.full_name)}"></label>
      <label>Phone<input name="phone" type="tel" value="${esc(c.phone)}"></label>
      <label>Email<input name="email" type="email" value="${esc(c.email)}"></label>
      <label>State<input name="state" maxlength="2" value="${esc(c.state)}"></label>
      <label>Language<select name="language">${['', 'English', 'Kreyòl', 'Español']
        .map(o => `<option ${c.language === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label>Birthday month<select name="birth_month"><option value=""></option>${MONTHS.map((m, k) => `<option value="${k + 1}" ${c.birth_month === k + 1 ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      <label>Birthday day<select name="birth_day"><option value=""></option>${Array.from({ length: 31 }, (_, k) => `<option ${c.birth_day === k + 1 ? 'selected' : ''}>${k + 1}</option>`).join('')}</select></label>
      <label>Return type<select name="return_type">${['', 'W-2', 'W-2 + dependents', '1099 / gig', 'Self-employed', 'W-2 + rental', 'Other']
        .map(o => `<option ${c.return_type === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label>Fee ($)<input name="fee" type="number" min="0" step="1" value="${esc(c.fee)}"></label>
      <label>Lead source<select name="lead_source">${['', 'Meta ad', 'Referral', 'Field event', 'Google profile', 'Website', 'Returning', 'Other']
        .map(o => `<option ${c.lead_source === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
      <label>Campaign / ad<input name="campaign" value="${esc(c.campaign)}"></label>
      <label>Next follow-up<input name="next_follow_up" type="date" value="${esc(c.next_follow_up)}"></label>
      ${isAdmin() ? `<label>Agent<select name="agent_id">${S.agents.map(a => `<option value="${a.id}" ${c.agent_id === a.id ? 'selected' : ''}>${esc(a.full_name)}</option>`).join('')}</select></label>` : ''}
      <label class="check"><input type="checkbox" name="bank_product" ${c.bank_product ? 'checked' : ''}> Bank product</label>
      <label class="check"><input type="checkbox" name="returning_client" ${c.returning_client ? 'checked' : ''}> Returning client</label>
      <div class="row" style="grid-column:1/-1;justify-content:space-between"><button class="btn">${id ? 'Save changes' : 'Add client'}</button>
        ${id && isAdmin() ? '<button type="button" class="btn ghost danger" id="del">Delete client</button>' : ''}</div>
    </form>
    <div class="warnbox">Never put SSNs, IDs, bank numbers or tax documents here. Those go in Cognito and the tax software.</div>
    ${id ? `<div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><h3 style="font-size:16px">Documents received</h3><b id="dcount">${docsIn(c)} of ${DOCS.length}</b></div>
      <div class="docs">${DOCS.map(d => `<label class="check"><input type="checkbox" data-doc="${d[0]}" ${docsOf(c)[d[0]] ? 'checked' : ''}> ${esc(d[1])}</label>`).join('')}</div>
      <p class="note" style="margin:0">Check off what you have received. This is only a checklist. The documents themselves stay in Cognito and the tax software.</p>
      ${intakeFor(c) ? `<div class="row">${telOf(c) ? '<a class="btn small" id="dsend" href="#">Send documents link</a>' : ''}
        <button type="button" class="btn ghost small" id="dcopy">Copy documents link</button></div>`
        : '<p class="note" style="margin:0">No documents link set yet. Ask Theo to add one on the Agents tab.</p>'}
      ${telOf(c) ? '<a class="btn ghost small" id="dmiss" href="#" style="align-self:flex-start">Text the missing list only</a>' : ''}</div>` : ''}
    ${id && canCognito ? `<div class="panel" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px">Cognito entry</h3>
      ${cognito && cognito.entry_url ? `<a href="${esc(cognito.entry_url)}" target="_blank" rel="noopener" class="btn" style="text-align:center;text-decoration:none">View in Cognito</a>` : '<p class="note" style="margin:0">No Cognito entry linked yet.</p>'}
      ${isAdmin() ? `<form id="cgf" class="row"><input name="url" type="url" placeholder="Paste Cognito entry link" style="flex:1" value="${esc(cognito && cognito.entry_url)}"><button class="btn small">Save link</button></form>` : ''}
    </div>` : ''}
    ${id ? `<div style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px">Activity</h3>
      <form id="nf" class="row"><select name="kind" style="width:110px"><option value="note">Note</option><option value="call">Call</option><option value="text">Text</option></select>
        <input name="body" placeholder="What happened?" required style="flex:1"><button class="btn small">Add</button></form>
      <div class="acts">${acts.map(a => `<div class="act"><time>${new Date(a.created_at).toLocaleString()} · ${esc(agentName(a.agent_id))}</time>
        <b>${esc(a.kind.replace('_', ' '))}:</b> ${esc(a.body)}</div>`).join('') || '<p class="note">No activity yet.</p>'}</div></div>` : ''}
  </aside>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector('#x').onclick = close;

  ov.querySelector('#cf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const rec = {
      full_name: f.get('full_name').trim(), phone: f.get('phone') || null, email: (f.get('email') || '').toLowerCase() || null,
      state: (f.get('state') || '').toUpperCase() || null, language: f.get('language') || null,
      birth_month: Number(f.get('birth_month')) || null, birth_day: Number(f.get('birth_day')) || null, return_type: f.get('return_type') || null,
      fee: f.get('fee') === '' ? null : Number(f.get('fee')), lead_source: f.get('lead_source') || null,
      campaign: f.get('campaign') || null, next_follow_up: f.get('next_follow_up') || null,
      bank_product: f.get('bank_product') === 'on', returning_client: f.get('returning_client') === 'on',
      agent_id: isAdmin() ? f.get('agent_id') : (c.agent_id || S.me.id)
    };
    const q = id ? sb.from('clients').update(rec).eq('id', id) : sb.from('clients').insert(rec);
    const { error } = await q;
    if (error) return toast(error.message);
    toast(id ? 'Saved' : 'Client added'); close(); loadAll();
  };

  const move = async d => {
    const { error } = await sb.from('clients').update({ stage: STAGES[i + d][0] }).eq('id', id);
    if (error) return toast(error.message);
    toast('Moved to ' + stageName(STAGES[i + d][0])); close(); loadAll();
  };
  if (id) { ov.querySelector('#next').onclick = () => move(1); ov.querySelector('#back').onclick = () => move(-1); }

  ov.querySelectorAll('[data-doc]').forEach(cb => cb.onchange = async () => {
    const docs = { ...docsOf(c), [cb.dataset.doc]: cb.checked };
    const { error } = await sb.from('clients').update({ docs }).eq('id', id);
    if (error) { cb.checked = !cb.checked; return toast(/docs/.test(error.message) ? 'Run the database step first, then use the checklist.' : error.message); }
    c.docs = docs; ov.querySelector('#dcount').textContent = docsIn(c) + ' of ' + DOCS.length;
    renderBody();
  });
  const book = ov.querySelector('#book');
  if (book) book.onclick = () => {
    book.href = smsHref(c, bookMsg(c, bookingFor(c)));
    try { sb.from('activities').insert({ client_id: id, agent_id: S.me.id, kind: 'text', body: 'Sent booking link' }).then(() => {}, () => {}); } catch (e) {}
  };

  const dsend = ov.querySelector('#dsend');
  if (dsend) dsend.onclick = () => {
    const url = intakeFor(c);
    dsend.href = smsHref(c, docsMsg(c, url));
    try { sb.from('activities').insert({ client_id: id, agent_id: S.me.id, kind: 'text', body: 'Sent documents link' }).then(() => {}, () => {}); } catch (e) {}
  };
  const dcopy = ov.querySelector('#dcopy');
  if (dcopy) dcopy.onclick = () => copyText(intakeFor(c), 'Documents link copied');

  const dmiss = ov.querySelector('#dmiss');
  if (dmiss) dmiss.onclick = e => {
    const missing = DOCS.filter(d => !docsOf(c)[d[0]]).map(d => d[1].replace(/ \(.*\)$/, ''));
    if (!missing.length) { e.preventDefault(); return toast('Nothing is missing for this client.'); }
    dmiss.href = smsHref(c, `Hi ${firstName(c)}, to finish your taxes I still need: ${missing.join(', ')}. Please send them through the secure link I gave you. Thank you!`);
  };

  const del = ov.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Tap again to delete for good'; return; }
    del.disabled = true;
    await sb.from('activities').delete().eq('client_id', id);
    await sb.from('client_cognito').delete().eq('client_id', id);
    const { data, error } = await sb.from('clients').delete().eq('id', id).select('id');
    if (error) { del.disabled = false; return toast(error.message); }
    if (!data || !data.length) { del.disabled = false; return toast('Delete was blocked by the database rules.'); }
    toast('Client deleted'); close(); loadAll();
  };

  const cgf = ov.querySelector('#cgf');
  if (cgf) cgf.onsubmit = async e => {
    e.preventDefault();
    const url = new FormData(e.target).get('url').trim();
    const { error } = await sb.from('client_cognito').upsert({ client_id: id, entry_url: url || null, submitted_at: url ? new Date().toISOString() : null });
    if (error) return toast(error.message);
    toast('Cognito link saved'); close(); openClient(id);
  };

  const nf = ov.querySelector('#nf');
  if (nf) nf.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await sb.from('activities').insert({ client_id: id, agent_id: S.me.id, kind: f.get('kind'), body: f.get('body') });
    if (error) return toast(error.message);
    close(); openClient(id);
  };
}

// ---------- Install as an app ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Android / Chrome install bar
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; showInstallBar('android');
});
// iPhone Safari: no prompt available, so tell them where the button is
(function () {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone && !sessionStorage.getItem('mm_ios_hint')) {
    sessionStorage.setItem('mm_ios_hint', '1');
    setTimeout(() => showInstallBar('ios'), 1200);
  }
})();
function showInstallBar(kind) {
  if (document.getElementById('instbar')) return;
  const b = document.createElement('div');
  b.id = 'instbar';
  b.innerHTML = kind === 'ios'
    ? '<span>Add Money Matter to your home screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button id="instx">Got it</button>'
    : '<span>Put Money Matter on your home screen.</span><button id="instgo">Install</button><button id="instx">Not now</button>';
  document.body.appendChild(b);
  const go = document.getElementById('instgo');
  if (go) go.onclick = async () => { b.remove(); if (installEvt) { installEvt.prompt(); installEvt = null; } };
  document.getElementById('instx').onclick = () => b.remove();
}

// ---------- Start ----------
if (SUPABASE_URL.startsWith('PASTE')) {
  app.innerHTML = '<main class="login"><div class="panel"><h1>Almost there</h1><p>Paste your Supabase URL and publishable key at the top of this file.</p></div></main>';
} else {
  const vipCode = new URLSearchParams(location.search).get('vip');
  if (vipCode !== null) renderVip(vipCode.trim().toLowerCase());
  else sb.auth.getSession().then(({ data: { session } }) => session ? loadAll() : renderLogin());
}
</script>
</body>
</html>
